apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-whisper-models
  labels:
    app.kubernetes.io/name: local-whisper
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-whisper
  labels:
    app.kubernetes.io/name: local-whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-whisper
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: local-whisper
          image: ghcr.io/chipclee/local-whisper:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: UV_COMPILE_BYTECODE
              value: "1"
            - name: UV_LINK_MODE
              value: copy
            - name: PATH
              value: /app/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: HF_HOME
              value: /models/huggingface
            - name: WHISPER_MODEL
              value: large-v3-turbo # Use "tiny", "base", "small", "medium", "large-v1", "large-v2", or "large-v3-turbo" for different model sizes
            - name: WHISPER_DEVICE
              value: cpu # Use "cpu" for CPU inference, "cuda" for GPU inference
            - name: WHISPER_COMPUTE_TYPE
              value: int8 # Use "int8" for quantized models, "float16" for FP16 models, or "float32" for full precision models
            - name: WHISPER_PORT
              value: "9000"
          volumeMounts:
            - name: model-cache
              mountPath: /models
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: local-whisper-models
---
apiVersion: v1
kind: Service
metadata:
  name: local-whisper
  labels:
    app.kubernetes.io/name: local-whisper
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: local-whisper
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
